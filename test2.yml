⭐ 📌 Optimized Scripted Pipeline – Clean, Structured & Confluence-Ready

@Library('dse-shared-lib') _
node(env.dse_worker_node) {

    // ============================================================
    // 1. Pipeline Properties
    // ============================================================
    properties([
        disableConcurrentBuilds(),
        buildDiscarder(logRotator(numToKeepStr: '30')),
        timestamps()
    ])

    ansiColor('xterm') {

        // ============================================================
        // 2. Parameters & Runtime Variables
        // ============================================================
        def gitProjectKey       = params.PROJECT_KEY
        def gitRepositoryName   = params.REPOSITORY_NAME
        def gitBranch           = params.BRANCH
        def gitPullRequestId    = params.PRID ?: 'NA'

        env.pipelineEnv         = "dev"

        def sonarAppName        = "Ecom-API-DEV"
        def fortifyVersion      = "DEV"

        def pcfSpace            = params.PCF_SPACE
        def pcfFoundation       = params.PCF_FOUNDATION
        def pcfRoute            = "ecom-api-${gitRepositoryName}"

        // Manifest files
        def manifestFiles = [
            dev1east1 : "manifest-dev1-east1.yml",
            dev1east2 : "manifest-dev1-east2.yml",
            deveast   : "manifest-dev-east.yml",
            devwest   : "manifest-dev-west.yml",
            qaeast    : "manifest-qa-east.yml",
            qawest    : "manifest-qa-west.yml",
            uateast   : "manifest-uat-east.yml",
            uatwest   : "manifest-uat-west.yml",
            qad       : "manifest-qa-dal.yml",
            qaphx     : "manifest-qa-phx.yml",
            uatdal    : "manifest-uat-dal.yml",
            uatphx    : "manifest-uat-phx.yml",
            proddal   : "manifest-prod-dal.yml"
        ]

        try {

            timeout(time: 40, unit: 'MINUTES') {

                // ============================================================
                // 3. Checkout
                // ============================================================
                stage("Checkout") {
                    logStage("checkout") {
                        gitSCMCodeCheckout(gitProjectKey, gitRepositoryName, gitBranch)
                        validateBuildReplayed()
                    }
                }

                // ============================================================
                // 4. Validate Build Properties
                // ============================================================
                stage("Validate Build Properties") {
                    logStage("validate-build.properties") {
                        validateBuildFile(gitBranch)
                    }
                }

                // ============================================================
                // 5. Validate Master Sync
                // ============================================================
                stage("Validate Master Sync") {
                    logStage("validate-master-sync") {
                        validateWithMaster(gitBranch)
                    }
                }

                // ============================================================
                // 6. Validate Manifest Files
                // ============================================================
                stage("Validate Manifest") {
                    logStage("validate-manifest") {

                        if (pcfFoundation.equalsIgnoreCase('east-1-dev1')) {
                            fileExists(manifestFiles.dev1east1) ?
                                validateSplunkIndex(manifestFiles.dev1east1, 'prod') :
                                buildFailed("Missing manifest for east-1-dev1")
                        }
                        else if (pcfFoundation.equalsIgnoreCase('east-2-dev1')) {
                            fileExists(manifestFiles.dev1east2) ?
                                validateSplunkIndex(manifestFiles.dev1east2, 'prod') :
                                buildFailed("Missing manifest for east-2-dev1")
                        }
                        else {
                            // Add other foundation logic here
                        }
                    }
                }

                // ============================================================
                // 7. InfoSec Tools Validation
                // ============================================================
                stage("Validate InfoSec Tool Onboarding") {
                    logStage("validate-app-onboarded-in-info-sec-tools") {

                        def infoSecScanAppName = getInfoSecScanAppName(gitProjectKey, gitRepositoryName)

                        validateAppNameInFortify(infoSecScanAppName)
                        validateAppNameInNexusIQ(infoSecScanAppName)
                    }
                }

                // ============================================================
                // 8. Build
                // ============================================================
                stage("Build") {
                    logStage("build") {
                        buildProgress()
                        def appVersion = determineAppVersion(getAppVersionMaven(), gitBranch)
                        buildMaven(appVersion)
                    }
                }

                // ============================================================
                // 9. Secure Dependency Check
                // ============================================================
                stage("Validate Secure Dependency Artifacts") {
                    logStage("validate-secure-dependency-artifacts") {
                        validateSecureArtifactVersions(gitRepositoryName)
                    }
                }

                // ============================================================
                // 10. Add Tasks to Pull Request
                // ============================================================
                stage("Add Task to Pull Request") {
                    logStage("add-task-to-pull-request") {
                        if (gitPullRequestId != "NA") {
                            addCodingGuidelinesPullRequestTask(gitProjectKey, gitRepositoryName, gitPullRequestId)
                            addPRReviewChecklistPullRequestTask(gitProjectKey, gitRepositoryName, gitPullRequestId)
                        }
                    }
                }

                // ============================================================
                // 11. Parallel Scans - Sonar, Fortify, NexusIQ
                // ============================================================
                parallel(
                    "scan: sonar": {
                        stage("scan: sonar") {
                            logStage("scan-sonar") {
                                sonarScan(sonarAppName, gitProjectKey, gitRepositoryName, gitBranch, appVersion, gitPullRequestId)
                            }
                        }
                    },

                    "scan: fortify": {
                        stage("scan: fortify") {
                            logStage("scan-fortify") {
                                fortifyScan(infoSecScanAppName, gitProjectKey, gitRepositoryName, gitPullRequestId, fortifyVersion, gitBranch)
                            }
                        }
                    },

                    "scan: nexus-iq": {
                        stage("scan: nexus-iq") {
                            logStage("scan-nexus-iq") {
                                nexusIqScan(infoSecScanAppName, gitProjectKey, gitRepositoryName, gitPullRequestId)
                            }
                        }
                    }
                )

                // ============================================================
                // 12. uDeploy - Import Artifact
                // ============================================================
                stage("uDeploy: Import Artifact") {
                    logStage("udeploy-import-artifact") {

                        def selectedManifest =
                            pcfFoundation.equalsIgnoreCase('east-1-dev1') ? manifestFiles.dev1east1 :
                            pcfFoundation.equalsIgnoreCase('east-2-dev1') ? manifestFiles.dev1east2 :
                                                                            manifestFiles.devwest

                        uDeployDevVersionImport(gitRepositoryName, appVersion, selectedManifest, pcfRoute)
                    }
                }

                // ============================================================
                // 13. uDeploy - Deploy
                // ============================================================
                stage("uDeploy: Deploy") {
                    logStage("udeploy-deploy") {
                        uDeployDevDeployArtifact(gitRepositoryName, appVersion, pcfFoundation, pcfSpace)
                    }
                }

                // ============================================================
                // 14. Newman Tests
                // ============================================================
                stage("Generate Newman Report") {
                    logStage("generate-newman-report") {
                        testNewman("dev")
                    }
                }

                buildSuccess()
            }
        }
        catch (err) {
            handleBuildFailure(err)
        }
        finally {
            sendTeamsNotification()
        }
    }
}


