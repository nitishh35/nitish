You are seeing intermittent build failures in a multi-module Maven Jenkins job with the error:

[ERROR] AlternateAuthMfaControllerTest ? IllegalState
Failed to load ApplicationContext
@WebMergedContextConfiguration

This is a Spring Boot test context initialization failure, not a compilation issue.

Because it passes sometimes and fails other times, this points to environmental / test isolation / resource contention problems, which are common in CI pipelines.


---

🎯 What this error means

Spring Boot failed to start the test application context required for:

AlternateAuthMfaControllerTest

This happens before the test runs, during context bootstrapping.

The test uses:

@WebMvcTest / @SpringBootTest
ApplicationTestConfiguration
CommonTestConfiguration

So Spring is attempting to load beans and dependencies.


---

⚠️ Why it fails intermittently in Jenkins (but works locally)

✅ 1️⃣ Parallel module execution (MOST COMMON)

Maven multi-module builds often run tests in parallel:

mvn clean install -T 1C

or Jenkins parallel stages.

This causes:

port conflicts

shared static state collision

embedded server clashes

test context reuse issues


✔ Works sometimes
❌ fails when timing conflicts occur

✔ FIX

Disable parallel test execution:

mvn clean install -T 1

or in Surefire plugin:

<parallel>none</parallel>


---

✅ 2️⃣ Port conflict (embedded server)

If tests start embedded servers (Tomcat/Jetty):

multiple modules may try same port (8080)


✔ FIX

Use random port:

@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)

or

server.port=0


---

✅ 3️⃣ Test context caching collision

Spring caches contexts between tests. In CI parallel runs, cache reuse can break.

✔ FIX

Add:

@DirtiesContext(classMode = DirtiesContext.ClassMode.AFTER_CLASS)

Use only where needed.


---

✅ 4️⃣ Missing mock dependencies

If controller test loads full context and required beans are missing:

NoSuchBeanDefinitionException
BeanCreationException

It may fail based on test execution order.

✔ FIX

Use mocks:

@MockBean
private SomeService service;


---

✅ 5️⃣ Database / TestContainers / external dependency timing

If test requires:

DB connection

Testcontainers

Vault/secrets

config server


CI environment timing may cause failure.

✔ Check logs for:

Connection refused
Timeout
Cannot connect


---

✅ 6️⃣ Shared static state between tests

Static variables cause nondeterministic failures.

Avoid:

static Map cache = new HashMap();


---

✅ 7️⃣ Insufficient Jenkins agent memory

Spring Boot context startup is memory intensive.

Intermittent failure may show:

OutOfMemoryError
GC overhead limit exceeded

✔ Increase memory:

MAVEN_OPTS="-Xmx1024m"


---

🔍 Why this happens only in multi-module jobs

Multi-module builds introduce:

✔ concurrent test execution
✔ shared JVM resources
✔ context caching conflicts
✔ port & resource contention


---

🧪 Quick debugging steps (high value)

Step 1 — Run failing module alone in Jenkins

mvn -pl <module-name> test

If it passes → concurrency issue.


---

Step 2 — Disable parallel build temporarily

mvn clean install -T 1


---

Step 3 — Re-run failing test only

mvn -Dtest=AlternateAuthMfaControllerTest test


---

Step 4 — Enable full stack trace

mvn test -e -X


---

🧾 How to explain to your manager

Root cause:
The failure is caused by Spring Boot test context initialization errors during multi-module parallel execution in Jenkins. Resource conflicts and test context isolation issues cause intermittent failures.

Why intermittent:
When modules run concurrently, shared resources (ports, context cache, beans, memory) occasionally conflict, causing context startup failure.

Resolution plan:

1. Disable parallel test execution or isolate resources.


2. Configure random ports for embedded servers.


3. Mock required dependencies in controller tests.


4. Ensure test context isolation and remove shared state.




