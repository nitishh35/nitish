## How Living Document Handled It:

```groovy
// Create route - ignore if it already exists
sh "${cf} create-route ${pcfDomain} --hostname ${hostname}"

// Map route to app
sh "${cf} map-route ${appName} ${pcfDomain} --hostname ${hostname}"
```

**The key observation:** In the living document code, they simply run `cf create-route` **without any error handling**. 

### Why It Works:

In **newer versions of CF CLI** (version 7+), the `cf create-route` command is **idempotent**, meaning:
- If the route **doesn't exist** → it creates it
- If the route **already exists** → it returns a warning but **doesn't fail** the pipeline

So the command succeeds in both cases!

