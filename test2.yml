def call(def org, def pcfSpace, def pcfFoundation) {
    def envProperty = loadEnvironmentProperties()
    def pcfDeployUserId = envProperty.pcf_non_prod_deploy_user_id
    def pcfDeployCredentialId = envProperty.pcf_non_prod_deploy_credential_id
    
    def appName = "paymybill-api-features"
    
    // Convert api.sys.dev2.dal.pcf.syfbank.com -> app.dev2.dal.pcf.syfbank.com
    def pcfFoundationDomain = pcfFoundation.replace('api.sys.', 'app.')
    
    // Create unique hostname based on foundation
    def foundationShort = ""
    if (pcfFoundation.contains("dev2.dal")) {
        foundationShort = "dev2-dal"
    } else if (pcfFoundation.contains("dev2.phx")) {
        foundationShort = "dev2-phx"
    } else if (pcfFoundation.contains("dev1.use1")) {
        foundationShort = "dev1-use1"
    } else if (pcfFoundation.contains("dev1.use2")) {
        foundationShort = "dev1-use2"
    }
    
    def spaceName = pcfSpace.toLowerCase().replaceAll('[^a-z0-9]', '-')
    def uniqueHostname = "${appName}-${spaceName}-${foundationShort}"
    
    withCredentials([string(credentialsId: pcfDeployCredentialId, variable: 'credentials')]) {
        sh "cf login --skip-ssl-validation -a '${pcfFoundation}' -u '${pcfDeployUserId}' -p '${credentials}' -o '${org}' -s '${pcfSpace}'"
        
        println "INFO: Deploying ${appName} with unique route: ${uniqueHostname}.${pcfFoundationDomain}"
        
        // Push with no-route (manifest will be used for other settings)
        sh "cf push --no-route"
        
        // Map the unique route
        sh "cf map-route ${appName} ${pcfFoundationDomain} --hostname ${uniqueHostname}"
        
        println "INFO: Deployment successful!"
        println "INFO: Application URL: https://${uniqueHostname}.${pcfFoundationDomain}"
    }
}
