def call(def pcforg, def pcfSpace, def pcfFoundation, def manifestFile, def wiremockJar){
    def envProperty = loadEnvironmentProperties()
    def pcfDeployUserId = envProperty.pcf_non_prod_deploy_user_id
    def pcfDeployCredentialId = envProperty.pcf_non_prod_deploy_credential_id
    def pcfFoundationUrl = "https://api.sys.${pcfFoundation}.pcf.syfbank.com"
    def pcfDomain = "app.${pcfFoundation}.pcf.syfbank.com"
    def cf = envProperty.cf_cli_path  // Add this if available
    
    // Read app name from manifest
    def manifestData = readYaml file: manifestFile
    def appName = manifestData.applications[0].name
    
    withCredentials([string(credentialsId: pcfDeployCredentialId, variable: 'credentials')]){
        sh "cf login --skip-ssl-validation -a '${pcfFoundationUrl}' -u '${pcfDeployUserId}' -p '${credentials}' -o '${pcfOrg}' -s '${pcfSpace}'"
        
        // Push app without route and without starting
        sh "cf push ${appName} -f '${manifestFile}' -p '${wiremockJar}' --no-route --no-start"
        
        // Create route (idempotent - won't fail if exists)
        sh "cf create-route ${pcfDomain} --hostname ${appName}"
        
        // Map route to app
        sh "cf map-route ${appName} ${pcfDomain} --hostname ${appName}"
        
        // Start the app
        sh "cf start ${appName}"
        
