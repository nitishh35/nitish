## **COMPLETE FLOW EXPLANATION**

### **Design Logic (As Per Your Requirements)**

| Condition | Action |
|-----------|--------|
| Timeout + count > threshold + **not notified** | ✅ Send alert |
| Timeout + count > threshold + **already notified** | ❌ Skip alert |
| **No timeout** (any count) | ❌ **Never send alert** |
| Count ≤ threshold (any run) | Reset alert state to `false` |

---

### **Flow Scenarios**

**Assuming threshold = 6**

#### **Scenario 1: First timeout with high count**
```
Job 1: Count=7, Timeout=YES
├─ fortifyscan.groovy catches FlowInterruptedException
├─ Calls: managefortifyalertsstate(true)
├─ managefortifyalertsstate checks:
│  ├─ checkOnTimeout = true ✓
│  ├─ count (7) > threshold (6) ✓
│  ├─ alertStateFile doesn't exist or = "false"
│  ├─ ACTION: Send alerts to DevOps and Fortify teams
│  └─ Write alertStateFile = "true"
└─ Build fails due to timeout
```

#### **Scenario 2: No timeout, count still high**
```
Job 2: Count=8, Timeout=NO (scan completes)
├─ fortifyscan.groovy completes successfully
├─ Calls: managefortifyalertsstate(false) in finally block
├─ managefortifyalertsstate checks:
│  ├─ checkOnTimeout = false
│  ├─ count (8) > threshold (6)
│  ├─ ACTION: No action, preserve alert state
│  └─ alertStateFile remains = "true"
└─ Build succeeds
```

#### **Scenario 3: Timeout again, count still high (YOUR ISSUE)**
```
Job 3: Count=8, Timeout=YES
├─ fortifyscan.groovy catches FlowInterruptedException
├─ Calls: managefortifyalertsstate(true)
├─ managefortifyalertsstate checks:
│  ├─ checkOnTimeout = true ✓
│  ├─ count (8) > threshold (6) ✓
│  ├─ alertStateFile = "true" (already notified)
│  ├─ ACTION: Skip duplicate alert ✓
│  └─ Log: "Alert already sent for timeout with high pending count. Skipping duplicate notification."
└─ Build fails due to timeout
```

#### **Scenario 4: No timeout, count back to normal**
```
Job 4: Count=5, Timeout=NO (scan completes)
├─ fortifyscan.groovy completes successfully
├─ Calls: managefortifyalertsstate(false)
├─ managefortifyalertsstate checks:
│  ├─ checkOnTimeout = false
│  ├─ count (5) ≤ threshold (6) ✓
│  ├─ ACTION: Reset alert state
│  └─ Write alertStateFile = "false"
└─ Build succeeds
```

#### **Scenario 5: Timeout again after reset**
```
Job 5: Count=8, Timeout=YES
├─ fortifyscan.groovy catches FlowInterruptedException
├─ Calls: managefortifyalertsstate(true)
├─ managefortifyalertsstate checks:
│  ├─ checkOnTimeout = true ✓
│  ├─ count (8) > threshold (6) ✓
│  ├─ alertStateFile = "false" (state was reset)
│  ├─ ACTION: Send alerts again ✓
│  └─ Write alertStateFile = "true"
└─ Build fails due to timeout

