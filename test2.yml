    }
    
    withCredentials([string(credentialsId: pcfDeployCredentialId, variable: 'credentials')]){
        sh "${cf} login --skip-ssl-validation -a '${pcfFoundationUrl}' -u '${pcfDeployUserId}' -p '${credentials}' -o '${pcfOrg}' -s '${pcfSpace}'"
        
        sh "${cf} push ${appName} -f '${manifestFile}' -p '${wiremockJar}' --no-route --no-start"
        sh "${cf} create-route ${pcfDomain} --hostname ${hostname}"
        sh "${cf} map-route ${appName} ${pcfDomain} --hostname ${hostname}"
        sh "${cf} start ${appName}"
        
        println "INFO: Deployment successful"
        println "INFO: Wiremock application can be accessed at: https://${hostname}.${pcfDomain}"
    }
}
