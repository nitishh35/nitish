The stack trace you shared is not a generic Jenkins failure — it is a Spring Boot test bootstrap failure. The key error is:

Caused by: java.lang.IllegalStateException: No root application context located

followed by:

Failed to load ApplicationContext for WebMergedContextConfiguration

This tells us Spring Boot could not determine or create the main application context for your test.

Below is a precise diagnosis and the fastest path to resolution.


---

🔴 Root Cause: “No root application context located”

This happens when Spring Boot tests cannot find a valid @SpringBootConfiguration (usually your main application class).

From your error:

classes [com.syf.ecom.PartnerMfa,
         com.syf.ecom.api.common.utils.test.CommonTestConfiguration,
         com.syf.ecom.config.ApplicationTestConfiguration]

Spring is trying to load:

com.syf.ecom.PartnerMfa

👉 This should be your main Spring Boot class:

@SpringBootApplication
public class PartnerMfa { }

If it is missing OR not visible → context fails.


---

✅ FASTEST FIX (Try These in Order)

✅ ✔ FIX 1 — Ensure main application class exists

Verify:

package com.syf.ecom;

import org.springframework.boot.autoconfigure.SpringBootApplication;

@SpringBootApplication
public class PartnerMfa {
}

✔ Must be:

public

in base package com.syf.ecom

annotated with @SpringBootApplication



---

✅ ✔ FIX 2 — Explicitly tell Spring Boot which class is root

Add this to your test:

@SpringBootTest(classes = PartnerMfa.class)

⚠ If using @WebMvcTest, instead use:

@ContextConfiguration(classes = {PartnerMfa.class, ApplicationTestConfiguration.class})


---

✅ ✔ FIX 3 — Remove conflicting context loaders

You currently have:

@ContextConfiguration(classes = ApplicationTestConfiguration.class)

Spring Boot already tries to load the root context.

👉 Replace with:

@Import(ApplicationTestConfiguration.class)

✅ Recommended for WebMvcTest.


---

✅ ✔ FIX 4 — Verify package scanning hierarchy

Spring Boot scans from the package of the main class downward.

✔ GOOD:

com.syf.ecom        ← main class
com.syf.ecom.controller
com.syf.ecom.service

❌ BAD:

Main class in subpackage.


---

✅ ✔ FIX 5 — Remove unnecessary context configs

If using:

@WebMvcTest(AlternateAuthMfaController.class)

you DO NOT need full application context.

Try minimal config:

@WebMvcTest(AlternateAuthMfaController.class)
@Import(ApplicationTestConfiguration.class)


---

🔬 Why This Error Happens in Your Case

Your test uses:

@WebMvcTest
+ ContextConfiguration
+ custom test configs

Spring Boot tries to:

1️⃣ find root config
2️⃣ merge contexts
3️⃣ build test slice

It fails at step 1 → root not found.


