def call(pcfOrg, pcfSpace, pcfFoundation, manifestFile, wiremockJar){
    def envProperty = loadEnvironmentProperties()
    def pcfDeployUserId = envProperty.pcf_non_prod_deploy_user_id
    def pcfDeployCredentialId = envProperty.pcf_non_prod_deploy_credential_id
    def pcfFoundationUrl = "https://api.sys.${pcfFoundation}.pcf.syfbank.com"
    def pcfDomain = "app.${pcfFoundation}.pcf.syfbank.com"
    def cf = envProperty.cf_cli_path
    
    println "DEBUG: cf_cli_path = '${cf}'"
    println "DEBUG: pipelineEnv = '${env.pipelineEnv}'"
    println "DEBUG: pcfSpace = '${pcfSpace}'"
    
    def manifestData = readYaml file: manifestFile
    def appName = manifestData.applications[0].name
    
    if (!appName) {
