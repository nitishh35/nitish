DSE DevOps – Coding Standards for Pipelines, Shared Libraries & Scripts

Owner: DSE DevOps
Version: 1.0
Status: Draft
Last Updated: <update date>


---

1. Purpose

To enhance maintainability, consistency and readability, this document defines the standard coding style for all:

Jenkins Pipelines (multibranch, folder, freestyle with pipeline, etc.)

Jenkins Shared Libraries

Supporting scripts (Groovy, Shell, Python, etc.) maintained by the DSE DevOps team.


All new code must follow these standards. Existing code should be updated to comply as it is modified (“boy scout rule”).


---

2. Scope

This standard applies to:

All repositories owned or maintained by the DSE DevOps team.

Jenkinsfiles and pipeline jobs defined as code.

Shared library code under vars/ and src/ (Groovy).

Automation scripts called from pipelines (bash, sh, Python, PowerShell).



---

3. Core Principles

1. Readability over cleverness
Prefer simple, obvious code over “smart” but hard-to-read constructs.


2. Consistency over individuality
Use the same patterns across repos, even if you personally prefer something else.


3. Fail fast, fail loud
Pipelines should clearly surface where and why they failed.


4. Single source of truth
Common logic must live in shared libraries or reusable scripts, not copy-pasted.


5. Security by default
Treat credentials and secrets as first-class citizens: never echo, never hard-code.




---

4. General Coding Guidelines (All Languages)

4.1 Naming Conventions

Pipelines / Job Names

Use clear, descriptive names:
serviceName-environment-pipeline
Example: billing-api-dev-ci, billing-api-prod-deploy


Variables

Use lowerCamelCase for variables and parameters: buildStatus, releaseVersion.


Constants

Use UPPER_SNAKE_CASE: MAX_RETRIES, TIMEOUT_MINUTES.


Functions / Methods

Use lowerCamelCase and verbs: deployApp(), notifyTeam(), validateInputs().



4.2 Formatting

Maximum line length: 120 characters.

Indentation:

Spaces only, 4 spaces per level in Groovy, 2 or 4 in YAML (be consistent within file).


Braces:

def exampleMethod() {
    // body
}

One statement per line.


4.3 Comments

Write comments for why, not for what when the code is self-explanatory.

Use // for single-line comments; /* */ only for longer blocks.

Each public function in a shared library should have a short doc comment:

/**
 * Deploys application to given environment.
 * @param envName target environment (dev/qa/prod)
 */
def deployApp(String envName) { ... }


4.4 Logging

Use consistent log prefixes and levels:

INFO: for normal progress.

WARN: for recoverable issues.

ERROR: for failures.


Never log secrets or full credential objects.



---

5. Jenkins Pipeline Standards (Jenkinsfile)

5.1 Declarative vs Scripted

Default to Declarative Pipeline syntax.

Use Scripted only when declarative cannot handle a use case.
If used, keep scripted sections small and well-documented.


5.2 Standard Jenkinsfile Structure

Every Jenkinsfile should generally follow this structure:

pipeline {
    agent any

    options {
        disableConcurrentBuilds()
        timestamps()
        ansiColor('xterm')
        buildDiscarder(logRotator(numToKeepStr: '20'))
    }

    environment {
        APP_NAME       = 'my-app'
        ENVIRONMENT    = 'dev'
        // No secrets here – use credentials binding
    }

    parameters {
        string(name: 'BRANCH_NAME', defaultValue: 'main', description: 'Git branch to build')
        booleanParam(name: 'SKIP_TESTS', defaultValue: false, description: 'Skip test stage')
    }

    stages {
        stage('Checkout') {
            steps {
                checkout scm
            }
        }

        stage('Build') {
            steps {
                script {
                    dseBuild.buildApp(APP_NAME)
                }
            }
        }

        stage('Test') {
            when {
                expression { return !params.SKIP_TESTS }
            }
            steps {
                script {
                    dseTest.runUnitTests()
                }
            }
        }

        stage('Deploy') {
            when {
                branch 'main'
            }
            steps {
                script {
                    dseDeploy.deployToEnv(ENVIRONMENT)
                }
            }
        }
    }

    post {
        success {
            script {
                dseNotify.notifyTeam(currentBuild, 'SUCCESS')
            }
        }
        failure {
            script {
                dseNotify.notifyTeam(currentBuild, 'FAILURE')
            }
        }
        always {
            cleanWs()
        }
    }
}

5.3 Stage Naming Convention

Stage names must be short and descriptive, using Title Case:

Checkout, Build, Unit Tests, Integration Tests, Deploy to Dev, Smoke Tests.


Use the same stage names across services where applicable to make dashboards comparable.


5.4 Environment and Parameters

Use environment block only for non-sensitive values.

Use credentials() for secrets:

environment {
    DOCKER_CREDS = credentials('docker-registry-creds-id')
}

Do not hard-code environment-specific values. Externalize via:

Parameters

Config files

Shared library configuration methods



5.5 Error Handling

Use error("message") for intentional hard failures.

Wrap risky sections with try/catch when you need custom behavior, but do not swallow errors:

try {
    dseDeploy.deployToEnv(envName)
} catch (Exception ex) {
    echo "ERROR: Deployment failed – ${ex.message}"
    error("Deployment failed")
}


5.6 Use of Shared Libraries

Do not put long complex logic in Jenkinsfile.

All reusable logic should be in shared library functions:

@Library('dse-shared-lib') _



---

6. Jenkins Shared Library Standards

6.1 Structure

Standard structure:

dse-shared-lib/
  ├─ vars/
  │   ├─ dseBuild.groovy
  │   ├─ dseDeploy.groovy
  │   └─ dseNotify.groovy
  └─ src/
      └─ com/dse/devops/
          ├─ BuildUtils.groovy
          ├─ DeployUtils.groovy
          └─ NotificationUtils.groovy

vars/*.groovy:

Entry points used directly in Jenkinsfiles.

Provide simple, high-level DSL.


src/:

Contains reusable, testable Groovy classes.



6.2 Naming

Global vars in vars/:

Use lowerCamelCase describing function: dseBuild, dseDeploy, dseNotify.


Classes in src/:

Use PascalCase: BuildUtils, DeployUtils.



6.3 Coding Style (Groovy)

Use explicit types for method parameters and return when possible:

def deployApp(String env, String version) {
    // ...
}

Avoid using def for fields in classes when type is known.

Keep functions small (ideally < 50 lines). Split into helpers when longer.


6.4 Error Handling and Logging

Throw meaningful exceptions from utility classes; handle them at pipeline level.

Use consistent logging format in libs:

echo "[DSE-DEPLOY] Deploying ${appName} to ${envName}"


6.5 Documentation

Every vars/*.groovy file must have a header comment explaining its purpose and example usage:

/**
 * dseDeploy.groovy
 * Shared library for deployment functions.
 *
 * Usage in Jenkinsfile:
 *   @Library('dse-shared-lib') _
 *   dseDeploy.deployToEnv('dev')
 */



---

7. Shell Script Standards (bash / sh)

7.1 Shebang and Options

Always start with:

#!/usr/bin/env bash
set -euo pipefail

For POSIX sh-only scripts (if required):

#!/bin/sh
set -eu


7.2 Naming and Location

Scripts should live in a standard path (example):
scripts/ or ci/scripts/ in each repo.

File names: kebab-case.sh (e.g., build-artifacts.sh, deploy-app.sh).


7.3 Practices

Quote variables: "$VAR" instead of $VAR.

Use functions for logical blocks; avoid huge top-level scripts.

Avoid interactive behavior; scripts must be non-interactive for CI use.

Parameters:

APP_NAME="${1:?App name required}"
ENV_NAME="${2:?Environment required}"



---

8. Python Script Standards (if used)

Follow PEP 8 style guide.

Use snake_case for functions and variables.

Include a requirements.txt or pyproject.toml for dependencies.

Use entry point structure:

def main():
    # logic

if __name__ == "__main__":
    main()



---

9. Security & Secrets

Never:

Hard-code passwords, tokens, keys, or connection strings.

Print secret values in logs.


Always:

Use Jenkins Credentials Store and credentials() or withCredentials blocks.

Mask secrets using Jenkins credential bindings.


Examples:

withCredentials([usernamePassword(credentialsId: 'nexus-creds',
                                 usernameVariable: 'NEXUS_USER',
                                 passwordVariable: 'NEXUS_PASS')]) {
    sh """
      ./publish.sh --user "$NEXUS_USER" --password "$NEXUS_PASS"
    """
}



---

10. Code Review Checklist (DevOps Pipelines & Scripts)

Before merging, reviewers must validate:

1. Readability

Are stages, variables, and functions clearly named?

Is the flow easy to follow?



2. Consistency

Does it follow this coding standard for formatting and structure?

Are common tasks delegated to shared library functions where applicable?



3. Error Handling

Are failures properly surfaced?

Are try/catch blocks used only where needed and not hiding issues?



4. Security

No secrets hard-coded or logged.

Credentials are used via Jenkins credentials store.



5. Reusability

Reusable logic placed in shared lib or scripts instead of copy-paste.





---

11. Governance & Compliance

This standard is mandatory for all new Jenkins pipelines and shared library changes.

Non-compliant code changes must not be approved in code review.

The DSE DevOps team will:

Evolve this document as new patterns and tools are adopted.

Periodically review existing pipelines and refactor them towards compliance.




