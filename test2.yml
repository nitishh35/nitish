def call(def org, def pcfSpace, def pcfFoundation) {

    def envProperty = loadEnvironmentProperties()
    def pcfDeployUserId = envProperty.pcf_non_prod_deploy_user_id
    def pcfDeployCredentialId = envProperty.pcf_non_prod_deploy_credential_id

    //--------------------------------------------------------------------
    // Extract app name from manifest.yml
    //--------------------------------------------------------------------
    def appName = sh(
        script: """
            grep -E '^[[:space:]]*-?[[:space:]]*name:' manifest.yml \
            | head -1 \
            | sed 's/.*name:[[:space:]]*//'
        """,
        returnStdout: true
    ).trim()

    if (!appName) error "Unable to extract app name from manifest.yml"

    //--------------------------------------------------------------------
    // Build domain and hostname
    //--------------------------------------------------------------------
    def pcfDomain = pcfFoundation.replace("api.sys.", "app.")
    def hostname  = "${appName}-qa"

    def CF = "/appbin/cf_cli/cf"

    println "INFO: Attempting final route:"
    println "https://${hostname}.${pcfDomain}"


    //--------------------------------------------------------------------
    // CF Login + push + create-route + map-route + start
    //--------------------------------------------------------------------
    withCredentials([string(credentialsId: pcfDeployCredentialId, variable: 'credentials')]) {

        // 1. LOGIN
        sh """
            ${CF} login \\
              --skip-ssl-validation \\
              -a '${pcfFoundation}' \\
              -u '${pcfDeployUserId}' \\
              -p '${credentials}' \\
              -o '${org}' \\
              -s '${pcfSpace}'
        """

        // 2. PUSH WITHOUT ROUTE + WITHOUT STARTING
        sh """
            ${CF} push ${appName} --no-route --no-start
        """

        // 3. CREATE ROUTE (correct spacing before --hostname!!)
        sh """
            ${CF} create-route ${org} ${pcfDomain} --hostname ${hostname}
        """

        // 4. MAP ROUTE
        sh """
            ${CF} map-route ${appName} ${pcfDomain} --hostname ${hostname}
        """

        // 5. START APP
        sh """
            ${CF} start ${appName}
        """

        println "INFO: Application deployed successfully!"
        println "INFO: Final URL → https://${hostname}.${pcfDomain}"
    }
}







