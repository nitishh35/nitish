mvn -Dtest=AlternateAuthMfaControllerTest test


---

Step 4 — Enable full stack trace

mvn test -e -X


---

🧾 How to explain to your manager

Root cause:
The failure is caused by Spring Boot test context initialization errors during multi-module parallel execution in Jenkins. Resource conflicts and test context isolation issues cause intermittent failures.

Why intermittent:
When modules run concurrently, shared resources (ports, context cache, beans, memory) occasionally conflict, causing context startup failure.

Resolution plan:

1. Disable parallel test execution or isolate resources.


2. Configure random ports for embedded servers.


3. Mock required dependencies in controller tests.


4. Ensure test context isolation and remove shared state.




