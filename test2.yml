    }
    
    // Determine hostname based on space name (checking for QA/DEV in space name)
    def hostname
    if (pcfSpace.toLowerCase().contains('qa')) {
        hostname = "${appName}-qa"
        println "INFO: QA environment detected, using hostname: ${hostname}"
