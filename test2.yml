Routes destinations must be in either the route's space or the route's shared spaces

Based on your manifest file, here's the complete working code to fix the route conflict issue:

## 1. Updated `manifest.yml`

```yaml
---
applications:
- name: paymybill-api-features
  path: build
  buildpack: staticfile_buildpack
  disk_quota: 256MB
  memory: 128MB
  no-route: true
```

**Key change:** Add `no-route: true` to prevent automatic route creation.

## 2. Updated `staticFileDeployPCFWithManifest` Function

```groovy
def call(def org, def pcfSpace, def pcfFoundation) {
    def envProperty = loadEnvironmentProperties()
    def pcfDeployUserId = envProperty.pcf_non_prod_deploy_user_id
    def pcfDeployCredentialId = envProperty.pcf_non_prod_deploy_credential_id
    
    // App name from your manifest
    def appName = "paymybill-api-features"
    
    // Convert foundation to domain
    // api.sys.dev1.use1.pcf.syfbank.com -> app.dev1.use1.pcf.syfbank.com
    def pcfFoundationDomain = pcfFoundation.replace('api.sys.', 'app.')
    
    // Extract foundation identifier (dev1.use1, dev1.use2, dev2.dal, dev2.phx)
    def foundationId = pcfFoundation.tokenize('.')[2..3].join('.')
    
    // Create unique hostname: appname-space-foundation
    // Example: paymybill-api-features-ecom-api-paymybill-qa-dev1-use1
    def spaceName = pcfSpace.toLowerCase().replaceAll('[^a-z0-9]', '-')
    def hostname = "${appName}-${spaceName}-${foundationId.replace('.', '-')}"
    
    withCredentials([string(credentialsId: pcfDeployCredentialId, variable: 'credentials')]) {
        sh "cf login --skip-ssl-validation -a '${pcfFoundation}' -u '${pcfDeployUserId}' -p '${credentials}' -o '${org}' -s '${pcfSpace}'"
        
        // Push the app (no-route is set in manifest)
        sh "cf push"
        
        // Map unique route for this space and foundation
        sh "cf map-route ${appName} ${pcfFoundationDomain} --hostname ${hostname}"
        
        println "INFO: Successfully deployed ${appName} to ${pcfFoundation}"
        println "INFO: Route: ${hostname}.${pcfFoundationDomain}"
    }
}
```

